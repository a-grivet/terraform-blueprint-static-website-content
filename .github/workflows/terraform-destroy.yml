# ============================================================================
# TERRAFORM DESTROY WORKFLOW - Static Website
# ============================================================================
# This workflow DESTROYS all infrastructure. Use with EXTREME caution!
# ============================================================================

name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (dev or prod)'
        required: true
        type: choice
        options:
          - dev
          - prod
      
      confirmation:
        description: 'Type DESTROY-DEV or DESTROY-PROD to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Confirmation
    runs-on: ubuntu-latest
    outputs:
      aws_role: ${{ steps.set-config.outputs.aws_role }}
      working_dir: ${{ steps.set-config.outputs.working_dir }}
    
    steps:
      - name: Validate Confirmation String
        run: |
          ENV="${{ inputs.environment }}"
          EXPECTED="DESTROY-${ENV^^}"
          
          if [ "${{ inputs.confirmation }}" != "$EXPECTED" ]; then
            echo "❌ Incorrect confirmation!"
            echo "Expected: $EXPECTED"
            echo "Got: ${{ inputs.confirmation }}"
            exit 1
          fi
          
          echo "⚠️ WARNING: About to destroy $ENV environment!"
          echo "✅ Confirmation validated"
      
      - name: Set Environment Configuration
        id: set-config
        run: |
          ENV="${{ inputs.environment }}"
          
          if [ "$ENV" == "dev" ]; then
            echo "aws_role=${{ vars.DEV_DEPLOY_AWS_ROLE_TO_ASSUME }}" >> $GITHUB_OUTPUT
            echo "working_dir=infrastructure/environments/dev" >> $GITHUB_OUTPUT
          else
            echo "aws_role=${{ vars.PROD_DEPLOY_AWS_ROLE_TO_ASSUME }}" >> $GITHUB_OUTPUT
            echo "working_dir=infrastructure/environments/prod" >> $GITHUB_OUTPUT
          fi
  
  destroy:
    name: Destroy ${{ inputs.environment }} Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.environment == 'prod' && 'production' || '' }}
    
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: eu-west-1
      FEATURE_NAME: static-website
      WORKING_DIR: ${{ needs.validate.outputs.working_dir }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      
      - name: Setup AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install
          aws --version

      - name: Setup SSH for Private Module Access
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.TERRAFORM_MODULES_SECRET_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.validate.outputs.aws_role }}
          role-session-name: github-destroy-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      
      - name: Verify AWS Identity
        run: |
          echo "=========================================="
          echo "AWS Identity Verification"
          echo "=========================================="
          aws sts get-caller-identity
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "⚠️ WARNING: About to destroy resources in account: $ACCOUNT_ID"
          echo "=========================================="
      
      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "Initializing Terraform"
          echo "=========================================="
          
          CURRENT_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="${FEATURE_NAME}-terraform-backend-${AWS_REGION}-${CURRENT_ACCOUNT_ID}"
          
          cat > backend.tfbackend << BACKEND_CONFIG_EOF
          bucket         = "${BUCKET_NAME}"
          key            = "terraform.tfstate"
          region         = "${AWS_REGION}"
          encrypt        = true
          use_lockfile   = true
          BACKEND_CONFIG_EOF
          
          terraform init -backend-config=backend.tfbackend -input=false
          
          rm -f backend.tfbackend
          
          echo "✅ Terraform initialized"
      
      - name: Terraform Plan Destroy
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "Planning Destruction"
          echo "=========================================="
          terraform plan -destroy -var-file=terraform.tfvars -out=destroy.tfplan
          terraform show -no-color destroy.tfplan
      
      - name: Wait for Final Confirmation
        run: |
          echo "=========================================="
          echo "⚠️ FINAL WARNING ⚠️"
          echo "=========================================="
          echo "About to destroy ALL infrastructure in: ${{ env.ENVIRONMENT }}"
          echo "Waiting 30 seconds..."
          echo "=========================================="
          sleep 30
      
      - name: Terraform Destroy
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "Destroying Infrastructure"
          echo "=========================================="
          terraform apply -auto-approve destroy.tfplan
      
      - name: Destroy Summary
        run: |
          echo "=========================================="
          echo "Destroy Summary"
          echo "=========================================="
          echo "✅ Infrastructure destroyed successfully"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "⚠️ Terraform state backend resources were NOT destroyed"
          echo "=========================================="
